name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Tous les jours à 2h du matin
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  integration-tests:
    name: Integration Tests with Docker
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx requests

      - name: 🏗️ Build Docker images
        run: |
          docker-compose build
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: 🚀 Start services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          sleep 30

      - name: 🔍 Check services health
        run: |
          echo "Checking agent service..."
          curl -f http://localhost:8000/health || exit 1
          
          echo "Checking tfidf service..."
          curl -f http://localhost:8002/health || exit 1
          
          echo "Checking transformer service..."
          curl -f http://localhost:8001/ || exit 1
          
          echo "✅ All services are healthy"

      - name: 🧪 Run integration tests
        run: |
          # Test agent prediction
          response=$(curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "My computer is not working"}')
          echo "Agent response: $response"
          
          # Test tfidf prediction
          response=$(curl -X POST http://localhost:8002/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Cannot access my account"}')
          echo "TF-IDF response: $response"
          
          # Test transformer prediction
          response=$(curl -X POST http://localhost:8001/predict \
            -H "Content-Type: application/json" \
            -d '{"text": "Need help with purchase order"}')
          echo "Transformer response: $response"
          
          echo "✅ All integration tests passed"

      - name: 🔬 Run Prometheus metrics test
        run: |
          # Vérifier que les métriques sont exposées
          curl -f http://localhost:8000/metrics | grep "http_requests_total" || exit 1
          curl -f http://localhost:8001/metrics | grep "http_requests_total" || exit 1
          curl -f http://localhost:8002/metrics | grep "http_requests_total" || exit 1
          echo "✅ Prometheus metrics are working"

      - name: 📊 Check Prometheus targets
        run: |
          # Attendre que Prometheus soit prêt
          sleep 10
          
          # Vérifier les targets
          targets=$(curl -s http://localhost:9090/api/v1/targets | jq '.data.activeTargets | length')
          echo "Active Prometheus targets: $targets"
          
          if [ "$targets" -ge 3 ]; then
            echo "✅ Prometheus is scraping all services"
          else
            echo "⚠️  Warning: Not all targets are up"
          fi

      - name: 🎨 Check Grafana
        run: |
          # Vérifier que Grafana est accessible
          curl -f http://localhost:3000/api/health || exit 1
          echo "✅ Grafana is running"

      - name: 📈 Check MLflow
        run: |
          # Vérifier que MLflow est accessible
          curl -f http://localhost:5000/health || echo "⚠️  MLflow health check failed (normal if not configured)"

      - name: 📋 Display service logs
        if: failure()
        run: |
          echo "=== Agent Service Logs ==="
          docker-compose logs agent_service
          
          echo "=== TF-IDF Service Logs ==="
          docker-compose logs tfidf_service
          
          echo "=== Transformer Service Logs ==="
          docker-compose logs transformer_service

      - name: 📊 Display container stats
        if: always()
        run: |
          docker-compose ps
          docker stats --no-stream

      - name: 🛑 Stop services
        if: always()
        run: |
          docker-compose down -v

  load-tests:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install requests locust

      - name: 🏗️ Start services
        run: |
          docker-compose up -d
          sleep 30

      - name: 🔥 Run load tests with Locust
        run: |
          # Créer un fichier de test Locust simple
          cat > locustfile.py << 'EOF'
          from locust import HttpUser, task, between

          class CallCenterUser(HttpUser):
              wait_time = between(0.5, 2)
              
              @task
              def predict(self):
                  self.client.post("/predict", json={
                      "text": "Test load testing request"
                  })
          EOF
          
          # Lancer Locust en mode headless
          locust -f locustfile.py \
            --host http://localhost:8000 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 30s \
            --headless \
            --only-summary

      - name: 📊 Performance summary
        run: |
          echo "✅ Load test completed"
          echo "Check the logs above for performance metrics"

      - name: 🛑 Stop services
        if: always()
        run: |
          docker-compose down -v

  end-to-end-tests:
    name: End-to-End User Journey
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install requests

      - name: 🏗️ Start full stack
        run: |
          docker-compose up -d
          sleep 40

      - name: 🎭 Simulate user journey
        run: |
          python << 'EOF'
          import requests
          import time

          base_url = "http://localhost:8000"
          
          # Test 1: Ticket matériel
          print("Test 1: Hardware ticket...")
          response = requests.post(f"{base_url}/predict", json={
              "text": "My computer keyboard is not responding"
          })
          assert response.status_code == 200
          result = response.json()
          print(f"  Category: {result.get('category')}")
          print(f"  Confidence: {result.get('confidence')}")
          
          time.sleep(1)
          
          # Test 2: Ticket accès
          print("Test 2: Access ticket...")
          response = requests.post(f"{base_url}/predict", json={
              "text": "I cannot login to my account, forgot password"
          })
          assert response.status_code == 200
          result = response.json()
          print(f"  Category: {result.get('category')}")
          
          time.sleep(1)
          
          # Test 3: Ticket multilingue
          print("Test 3: Multilingual ticket...")
          response = requests.post(f"{base_url}/predict", json={
              "text": "Mon imprimante ne fonctionne plus"
          })
          assert response.status_code == 200
          
          print("✅ All E2E tests passed!")
          EOF

      - name: 🛑 Stop services
        if: always()
        run: |
          docker-compose down -v

  notify:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [integration-tests, load-tests, end-to-end-tests]
    if: always()
    
    steps:
      - name: 📊 Workflow summary
        run: |
          echo "## 🧪 Integration Tests Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Integration Tests:** ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Load Tests:** ${{ needs.load-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**E2E Tests:** ${{ needs.end-to-end-tests.result }}" >> $GITHUB_STEP_SUMMARY