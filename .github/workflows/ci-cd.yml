name: CI/CD Pipeline

on:
  push:
    branches: [ main, fatma ]
  pull_request:
    branches: [ main, fatma ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/callcenterai

jobs:
  # ============================================
  # JOB 1: Lint et Quality Checks
  # ============================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent_service, tfidf_service, transformer_service]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort bandit pytest pytest-cov
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi

      - name: 🎨 Run Black (code formatting)
        run: |
          black --check services/${{ matrix.service }}/ || echo "::warning::Black formatting issues found"
        continue-on-error: true

      - name: 📏 Run Flake8 (linting)
        run: |
          flake8 services/${{ matrix.service }}/ \
            --max-line-length=100 \
            --ignore=E203,W503,E501 \
            --exclude=__pycache__,venv,.venv,mlruns
        continue-on-error: true

      - name: 🔤 Run isort (import sorting)
        run: |
          isort --check-only services/${{ matrix.service }}/ || echo "::warning::Import sorting issues found"
        continue-on-error: true

      - name: 🔒 Run Bandit (security)
        run: |
          bandit -r services/${{ matrix.service }}/ \
            -ll \
            -x "*/tests/*,*/test_*,*/__pycache__/*,*/mlruns/*"
        continue-on-error: true

  # ============================================
  # JOB 2: Tests Unitaires
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        service: [agent_service, tfidf_service, transformer_service]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi

      - name: 🧪 Run tests
        run: |
          if [ -d "services/${{ matrix.service }}/tests" ]; then
            pytest services/${{ matrix.service }}/tests/ -v --cov --cov-report=xml
          else
            echo "::warning::No tests found for ${{ matrix.service }}"
          fi
        continue-on-error: true

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: ${{ matrix.service }}
          name: codecov-${{ matrix.service }}
        continue-on-error: true

  # ============================================
  # JOB 3: Build Docker Images
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service: 
          - name: agent_service
            context: ./services/agent_service
            dockerfile: ./services/agent_service/Dockerfile
          - name: tfidf_service
            context: ./services/tfidf_service
            dockerfile: ./services/tfidf_service/Dockerfile
          - name: transformer_service
            context: .
            dockerfile: ./services/transformer_service/Dockerfile
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Create mlruns directories
        run: |
          # Create mlruns for each service
          mkdir -p services/agent_service/mlruns
          mkdir -p services/tfidf_service/mlruns
          mkdir -p services/transformer_service/mlruns
          
          # For transformer_service with root context, also create at root
          mkdir -p ./mlruns
          
          echo "✅ Created mlruns directories"

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔨 Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💾 Save image for scanning
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker save $IMAGE_TAG -o ${{ matrix.service.name }}.tar

      - name: 📤 Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}-image
          path: ${{ matrix.service.name }}.tar
          retention-days: 1

  # ============================================
  # JOB 4: Security Scan avec Trivy
  # ============================================
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [agent_service, tfidf_service, transformer_service]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image

      - name: 📦 Load Docker image
        run: |
          docker load -i ${{ matrix.service }}.tar
          IMAGE_TAG=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep ${{ matrix.service }} | head -n1)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: 📊 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

      - name: 📋 Generate Trivy report (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  # ============================================
  # JOB 5: Push Docker Images
  # ============================================
  push:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: 
          - name: agent_service
            context: ./services/agent_service
            dockerfile: ./services/agent_service/Dockerfile
          - name: tfidf_service
            context: ./services/tfidf_service
            dockerfile: ./services/tfidf_service/Dockerfile
          - name: transformer_service
            context: .
            dockerfile: ./services/transformer_service/Dockerfile
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📁 Create mlruns directories
        run: |
          mkdir -p services/agent_service/mlruns
          mkdir -p services/tfidf_service/mlruns
          mkdir -p services/transformer_service/mlruns
          mkdir -p ./mlruns

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================
  # JOB 6: Deploy (optionnel)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy notification
        run: |
          echo "🎉 Deployment successful!"
          echo "Images pushed to ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          echo "Ready to deploy with: docker-compose pull && docker-compose up -d"

      # Décommentez pour un vrai déploiement
      # - name: 🚢 Deploy to server
      #   uses: appleboy/ssh-action@master
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_KEY }}
      #     script: |
      #       cd /path/to/project
      #       docker-compose pull
      #       docker-compose up -d

  # ============================================
  # JOB 7: Notification
  # ============================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-scan, push]
    if: always()
    
    steps:
      - name: 📊 Check workflow status
        id: status
        run: |
          if [[ "${{ needs.lint.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.build.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
            echo "color=good" >> $GITHUB_OUTPUT
          else
            echo "status=❌ FAILURE" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: 📢 Workflow summary
        run: |
          echo "## 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Push: ${{ needs.push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY